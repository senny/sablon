name: Ruby tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        ruby-version: ['2.3', '2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        channel: ['stable']

        include:
          - ruby-version: 'head'
            channel: 'experimental'

    env:
      BUNDLE_GEMFILE: gemfiles/ci.gemfile

    continue-on-error: ${{ matrix.channel != 'stable' }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests
      env:
        # Raise on any string literal mutation, to stay ready for frozen string
        # literals by default. Skipped on Rubies whose RubyGems or gems mutate
        # string literals, which fails before the tests run.
        # See https://gist.github.com/fxn/bf4eed2505c76f4fca03ab48c43adc72
        RUBYOPT: ${{ !contains(fromJSON('["2.3", "2.4", "2.5", "2.6"]'), matrix.ruby-version) && '--enable=frozen-string-literal --debug=frozen-string-literal' || '' }}
      run: bundle exec rake
